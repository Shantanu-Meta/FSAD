# ===== DEVELOPMENT PROFILE =====
# H2 in-memory database — auto-configured for local development.
spring:
  datasource:
    url: jdbc:h2:mem:admissiondb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.security: INFO
    com.bits.fsad: DEBUG
