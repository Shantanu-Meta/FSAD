# ===== PRODUCTION PROFILE =====
# PostgreSQL (default). Switch to MySQL by overriding the datasource properties
# via environment variables. Zero code changes required to switch.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/admissiondb}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:admission}
spring.datasource.password=${DB_PASSWORD:admission}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# --- To run on MySQL instead, set these environment variables: ---
# DB_URL=jdbc:mysql://localhost:3306/admissiondb
# DB_DRIVER=com.mysql.cj.jdbc.Driver
# DB_DIALECT=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=WARN
logging.level.com.bits.fsad=INFO
